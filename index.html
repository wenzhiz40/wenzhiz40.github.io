<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal homepage of Wenzhi Zhong">
  <title>Wenzhi Zhong</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f3ec;
      color: #18221f;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(35, 125, 101, .16), transparent 36%),
        radial-gradient(circle at 85% 80%, rgba(201, 126, 53, .14), transparent 34%),
        #f6f3ec;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(24, 34, 31, .14);
      border-radius: 24px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 24px 70px rgba(24, 34, 31, .12);
    }
    .eyebrow {
      margin: 0 0 16px;
      color: #237d65;
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 9vw, 5.4rem);
      font-weight: 500;
      line-height: .94;
      letter-spacing: -.045em;
    }
    .intro {
      max-width: 46ch;
      margin: 28px 0 34px;
      color: #53615c;
      font-size: 1.08rem;
      line-height: 1.7;
    }
    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #18221f;
      border-radius: 999px;
      color: #18221f;
      font-weight: 650;
      text-decoration: none;
    }
    a:hover, a:focus-visible {
      background: #18221f;
      color: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #111715; color: #edf3ef; }
      body { background: #111715; }
      main { background: #18211e; border-color: #33413c; box-shadow: none; }
      .intro { color: #b7c4bf; }
      a { color: #edf3ef; border-color: #edf3ef; }
      a:hover, a:focus-visible { background: #edf3ef; color: #18221f; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal homepage</p>
    <h1>Wenzhi Zhong</h1>
    <p class="intro">This page provides my public contact information for academic and professional correspondence.</p>
    <div class="contact">
      <a href="mailto:wenzhiz40@gmail.com">wenzhiz40@gmail.com</a>
      <a href="https://github.com/wenzhiz40">GitHub profile</a>
    </div>
  </main>
</body>
</html>
